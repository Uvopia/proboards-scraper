{% extends 'base.html' %}
{% from 'macros.html' import csrf %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="container" style="max-width: 520px; margin: 0 auto 16px">
  <div class="title-bar"><h2>Register</h2></div>
  <div class="content padded">
    <form class="stacked" method="post">
      {{ csrf() }}
      <label for="username">Username <span class="hint">(used to log in; 3&ndash;32 letters, numbers, . _ -)</span></label>
      <input type="text" id="username" name="username" value="{{ form.get('username', '') }}" autocomplete="username" required pattern="[A-Za-z0-9_.\-]{3,32}">
      <label for="display_name">Display name <span class="hint">(shown on your posts)</span></label>
      <input type="text" id="display_name" name="display_name" value="{{ form.get('display_name', '') }}" maxlength="64">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ form.get('email', '') }}" autocomplete="email" required>
      <label for="password">Password <span class="hint">(at least 8 characters)</span></label>
      <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" name="confirm" autocomplete="new-password" required minlength="8">
      <div class="form-actions"><button type="submit">Register</button></div>
    </form>
  </div>
</div>
{% endblock %}
