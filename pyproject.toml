[tool.poetry]
name = "proboards-scraper"
version = "1.1.0"
description = ""
authors = ["Najam Syed <najam.r.syed@gmail.com>"]
license = "MIT"

packages = [
    { include = "proboards_scraper" },
    { include = "proboards_forum" },
]

[tool.poetry.dependencies]
python = "^3.9"
bs4 = "^0.0.1"
selenium = "^3.141.0"
SQLAlchemy = "^2.0"
requests = "^2.25.1"
aiohttp = "^3.7.4"
aiofiles = "^0.7.0"
cssutils = "^2.3.0"
Flask = "^3.0"
nh3 = ">=0.2.14"

[tool.poetry.dev-dependencies]
flake8 = "^3.9.2"
pytest = "^8.0"
sphinx-autodoc-typehints = "^1.12.0"
sphinx-rtd-theme = "^0.5.2"
Sphinx = "^4.2.0"

[tool.poetry.scripts]
pbs = "proboards_scraper.__main__:pbs_cli"
pbd = "proboards_scraper.__main__:pbd_cli"
pbf = "proboards_forum.cli:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
